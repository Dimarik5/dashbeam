name: iOS Build

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update Tauri CLI
        run: pnpm add -D @tauri-apps/cli@latest

      - name: Install WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked

      - name: Initialize iOS
        run: |
          rm -rf src-tauri/gen/apple
          pnpm tauri ios init

      - name: Install LLVM
        run: brew install llvm

      - name: Add LLVM to PATH
        run: echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      # ------------------------------------------------------------
      # Swift / Xcode diagnostics
      # ------------------------------------------------------------

      - name: Inspect Xcode and Swift versions
        run: |
          set -e

          echo "=== Xcode ==="
          xcodebuild -version

          echo
          echo "=== xcode-select ==="
          xcode-select -p

          echo
          echo "=== Swift ==="
          xcrun swift --version

          echo
          echo "=== swiftc ==="
          xcrun swiftc --version

          echo
          echo "=== swift-stdlib-tool ==="
          xcrun --find swift-stdlib-tool

      - name: Configure Swift target
        run: |
          python3 <<'PY'
          from pathlib import Path

          project = Path(
              "src-tauri/gen/apple/alt-sendme.xcodeproj/project.pbxproj"
          )

          text = project.read_text()

          # Remove all values that we previously injected.
          text = text.replace(
              "\n\t\t\t\tEMBEDDED_CONTENT_CONTAINS_SWIFT = YES;",
              ""
          )

          # Use the current Xcode Swift language mode.
          text = text.replace(
              "SWIFT_VERSION = 5.0;",
              "SWIFT_VERSION = 6.0;"
          )

          # Let Xcode embed Swift runtime libraries.
          if "ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES = YES;" not in text:
              text = text.replace(
                  "SWIFT_VERSION = 6.0;",
                  "SWIFT_VERSION = 6.0;\n"
                  "\t\t\t\tALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES = YES;"
              )

          project.write_text(text)

          print("Configured Swift target.")
          PY

      - name: Inspect generated Xcode settings
        run: |
          cd src-tauri/gen/apple

          xcodebuild \
            -project alt-sendme.xcodeproj \
            -target alt-sendme_iOS \
            -showBuildSettings \
            | grep -E \
              'TARGET_NAME|SWIFT_VERSION|SWIFT_VERSION|ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES|EMBEDDED_CONTENT_CONTAINS_SWIFT|LD_RUNPATH_SEARCH_PATHS|SDKROOT|TOOLCHAIN_DIR|SWIFT_EXEC'

      # ------------------------------------------------------------
      # Check generated sources
      # ------------------------------------------------------------

      - name: Inspect generated iOS sources
        run: |
          echo "=== Swift / ObjC sources ==="

          find src-tauri/gen/apple \
            -type f \
            \( -name "*.swift" -o -name "*.m" -o -name "*.mm" \) \
            -print

          echo
          echo "=== Swift references ==="

          grep -RniE \
            'import Swift|import Foundation|async |await |Task|@MainActor' \
            src-tauri/gen/apple \
            --include="*.swift" \
            --include="*.m" \
            --include="*.mm" \
            2>/dev/null || true

      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------

      - name: Build iOS without signing
        run: |
          pnpm tauri ios build --no-sign

      # ------------------------------------------------------------
      # Inspect the ORIGINAL IPA
      # No modifications here.
      # ------------------------------------------------------------

      - name: Inspect original IPA Swift runtime
        run: |
          set -e

          IPA="src-tauri/gen/apple/build/arm64/DashBeam.ipa"
          WORK="/tmp/dashbeam-original"

          rm -rf "$WORK"
          mkdir -p "$WORK"

          unzip -q "$IPA" -d "$WORK"

          APP_PATH=$(find "$WORK/Payload" \
            -maxdepth 1 \
            -type d \
            -name "*.app" \
            | head -1)

          FRAMEWORKS="$APP_PATH/Frameworks"

          echo "=== IPA ==="
          ls -lh "$IPA"

          echo
          echo "=== APP ==="
          echo "$APP_PATH"

          echo
          echo "=== Frameworks ==="
          find "$FRAMEWORKS" \
            -maxdepth 1 \
            -type f \
            -print 2>/dev/null || true

          echo
          echo "=== Swift libraries ==="
          find "$APP_PATH" \
            -name "libswift*.dylib" \
            -print

          echo
          echo "=== DashBeam Swift dependencies ==="
          xcrun otool -L "$APP_PATH/DashBeam" \
            | grep swift || true

          echo
          echo "=== Swift library dependencies ==="

          while IFS= read -r LIB; do
            echo
            echo "--- $LIB ---"
            xcrun otool -L "$LIB" \
              | grep swift || true
          done < <(
            find "$APP_PATH" \
              -name "libswift*.dylib"
          )

      # ------------------------------------------------------------
      # Ask Apple's own tool what Swift runtime is required.
      # Do NOT copy anything yet.
      # ------------------------------------------------------------

      - name: Determine required Swift runtime
        run: |
          set -e

          IPA="src-tauri/gen/apple/build/arm64/DashBeam.ipa"
          WORK="/tmp/dashbeam-stdlib"

          rm -rf "$WORK"
          mkdir -p "$WORK"

          unzip -q "$IPA" -d "$WORK"

          APP_PATH=$(find "$WORK/Payload" \
            -maxdepth 1 \
            -type d \
            -name "*.app" \
            | head -1)

          TOOL="$(xcrun --find swift-stdlib-tool)"

          echo "=== swift-stdlib-tool ==="
          echo "$TOOL"

          echo
          echo "=== Required runtime ==="

          "$TOOL" \
            --print \
            --verbose \
            --scan-executable "$APP_PATH/DashBeam" \
            --scan-folder "$APP_PATH/Frameworks" \
            --platform iphoneos

      # ------------------------------------------------------------
      # Verify IPA, but DO NOT modify it.
      # ------------------------------------------------------------

      - name: Verify original IPA
        run: |
          set -e

          IPA="src-tauri/gen/apple/build/arm64/DashBeam.ipa"
          TMP="/tmp/dashbeam-verify"

          rm -rf "$TMP"
          mkdir -p "$TMP"

          unzip -q "$IPA" -d "$TMP"

          APP_PATH=$(find "$TMP/Payload" \
            -maxdepth 1 \
            -type d \
            -name "*.app" \
            | head -1)

          echo "=== Final IPA ==="
          ls -lh "$IPA"

          echo
          echo "=== Swift libraries ==="
          find "$APP_PATH" \
            -name "libswift*.dylib" \
            -print

          echo
          echo "=== libswiftCore ==="

          if [ -f "$APP_PATH/Frameworks/libswiftCore.dylib" ]; then
            echo "FOUND"
            xcrun otool -L \
              "$APP_PATH/Frameworks/libswiftCore.dylib"
          else
            echo "NOT EMBEDDED"
          fi

          echo
          echo "=== libswift_Concurrency ==="

          if [ -f "$APP_PATH/Frameworks/libswift_Concurrency.dylib" ]; then
            echo "FOUND"
            xcrun otool -L \
              "$APP_PATH/Frameworks/libswift_Concurrency.dylib"
          else
            echo "NOT EMBEDDED"
          fi

      - name: Find IPA
        run: |
          find src-tauri/gen/apple \
            -name "*.ipa" \
            -print

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DashBeam-iOS
          path: src-tauri/gen/apple/**/*.ipa
