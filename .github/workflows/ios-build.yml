name: iOS Build

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update Tauri CLI
        run: pnpm add -D @tauri-apps/cli@latest

      - name: Install WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked

      - name: Initialize iOS
        run: |
          rm -rf src-tauri/gen/apple
          pnpm tauri ios init

      - name: Install LLVM
        run: brew install llvm

      - name: Add LLVM to PATH
        run: echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Configure Swift runtime embedding
        run: |
          python3 <<'PY'
          from pathlib import Path

          project = Path("src-tauri/gen/apple/alt-sendme.xcodeproj/project.pbxproj")

          text = project.read_text()

          if "ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES = YES;" in text:
              print("Swift runtime embedding is already enabled.")
          else:
              text = text.replace(
                  "SWIFT_VERSION = 5.0;",
                  "SWIFT_VERSION = 5.0;\n\t\t\t\tALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES = YES;"
              )

              project.write_text(text)
              print("Enabled ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES.")

          PY

      - name: Check Xcode project Swift settings
        run: |
          grep -n "ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES" \
          src-tauri/gen/apple/alt-sendme.xcodeproj/project.pbxproj || true
            
      - name: Build iOS without signing
        run: pnpm tauri ios build --no-sign

      - name: Inspect Swift libraries in IPA
        run: |
          IPA=$(find src-tauri/gen/apple -name "*.ipa" | head -n 1)

          echo "IPA: $IPA"

          rm -rf /tmp/dashbeam-ipa
          mkdir -p /tmp/dashbeam-ipa

          unzip -q "$IPA" -d /tmp/dashbeam-ipa

          echo ""
          echo "=== Frameworks directory ==="
          find /tmp/dashbeam-ipa/Payload -path "*/Frameworks/*" -print

          echo ""
          echo "=== Swift libraries ==="
          find /tmp/dashbeam-ipa/Payload -name "libswift*.dylib" -print

          echo ""
          echo "=== App contents ==="
          find /tmp/dashbeam-ipa/Payload/*.app -maxdepth 2 -type f -print

      - name: Find IPA
        run: find src-tauri/gen/apple -name "*.ipa" -print

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DashBeam-iOS
          path: src-tauri/gen/apple/**/*.ipa
