name: iOS Build

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update Tauri CLI
        run: pnpm add -D @tauri-apps/cli@latest

      - name: Install WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked

      - name: Initialize iOS
        run: |
          rm -rf src-tauri/gen/apple
          pnpm tauri ios init

      - name: Install LLVM
        run: brew install llvm

      - name: Add LLVM to PATH
        run: echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      # ------------------------------------------------------------
      # Inspect generated Xcode project
      # ------------------------------------------------------------

      - name: Inspect Xcode project
        run: |
          cd src-tauri/gen/apple

          echo "=== Build settings ==="

          xcodebuild \
            -project alt-sendme.xcodeproj \
            -target alt-sendme_iOS \
            -showBuildSettings \
            | grep -E \
              'TARGET_NAME|SWIFT_VERSION|ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES|EMBEDDED_CONTENT_CONTAINS_SWIFT|LD_RUNPATH_SEARCH_PATHS|IPHONEOS_DEPLOYMENT_TARGET|SDKROOT' \
            || true

          echo
          echo "=== Project Swift settings ==="

          grep -nE \
            'SWIFT_VERSION|ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES|EMBEDDED_CONTENT_CONTAINS_SWIFT' \
            alt-sendme.xcodeproj/project.pbxproj \
            || true

      # ------------------------------------------------------------
      # There are no Swift sources in this project.
      # Explicitly prevent Xcode from embedding Swift runtime.
      # ------------------------------------------------------------

      - name: Disable Swift runtime embedding
        run: |
          python3 <<'PY'
          from pathlib import Path

          project = Path(
              "src-tauri/gen/apple/alt-sendme.xcodeproj/project.pbxproj"
          )

          text = project.read_text()

          # Remove settings we previously injected.
          text = text.replace(
              "ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES = YES;",
              "ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES = NO;"
          )

          text = text.replace(
              "EMBEDDED_CONTENT_CONTAINS_SWIFT = YES;",
              "EMBEDDED_CONTENT_CONTAINS_SWIFT = NO;"
          )

          project.write_text(text)

          print("Swift runtime embedding disabled.")
          PY

      - name: Verify Swift embedding settings
        run: |
          cd src-tauri/gen/apple

          echo "=== Final Xcode settings ==="

          xcodebuild \
            -project alt-sendme.xcodeproj \
            -target alt-sendme_iOS \
            -showBuildSettings \
            | grep -E \
              'ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES|EMBEDDED_CONTENT_CONTAINS_SWIFT|SWIFT_VERSION|LD_RUNPATH_SEARCH_PATHS' \
            || true

      # ------------------------------------------------------------
      # Inspect generated native sources
      # ------------------------------------------------------------

      - name: Inspect generated iOS sources
        run: |
          echo "=== Native source files ==="

          find src-tauri/gen/apple \
            -type f \
            \( -name "*.swift" -o -name "*.m" -o -name "*.mm" \) \
            -print

          echo
          echo "=== Swift sources ==="

          find src-tauri/gen/apple \
            -type f \
            -name "*.swift" \
            -print

          echo
          echo "=== Swift references ==="

          grep -RniE \
            'import Swift|import Foundation|async |await |Task|@MainActor' \
            src-tauri/gen/apple \
            --include="*.swift" \
            --include="*.m" \
            --include="*.mm" \
            2>/dev/null \
            || true



      - name: Verify native-utils iOS plugin
        run: |
          echo "=== Source iOS plugin ==="
          find src-tauri/plugins/tauri-plugin-native-utils/ios -type f -maxdepth 5 -print

          echo
          echo "=== selectDownloadFolder in source ==="
          grep -Rni "selectDownloadFolder" \
            src-tauri/plugins/tauri-plugin-native-utils/ios || true

          echo
          echo "=== Generated iOS plugin ==="
          find src-tauri/gen/apple \
            -type f \
            \( -name "*.swift" -o -name "Package.swift" \) \
            -print | grep -i native || true

          echo
          echo "=== selectDownloadFolder in generated project ==="
          grep -Rni "selectDownloadFolder" \
            src-tauri/gen/apple 2>/dev/null || true

      - name: Inspect generated iOS project
        run: |
          echo "=== Generated apple directory ==="
          find src-tauri/gen/apple -maxdepth 3 -type f \
            \( -name "Package.swift" -o -name "*.pbxproj" -o -name "*.swift" \) \
            -print

          echo
          echo "=== Native utils references ==="
          grep -Rni "native-utils\|native_utils\|NativeUtils" \
            src-tauri/gen/apple 2>/dev/null || true

          echo
          echo "=== Tauri plugin iOS paths ==="
          grep -Rni "ios_path\|plugin" \
            src-tauri/plugins/tauri-plugin-native-utils 2>/dev/null | head -100 || true
            
      - name: Inspect Xcode native-utils integration
        run: |
          echo "=== native-utils in pbxproj ==="
          grep -niE \
            'native-utils|native_utils|NativeUtils' \
            src-tauri/gen/apple/alt-sendme.xcodeproj/project.pbxproj \
            || true

          echo
          echo "=== package references ==="
          grep -niE \
            'package|XCRemoteSwiftPackageReference|XCLocalSwiftPackageReference' \
            src-tauri/gen/apple/alt-sendme.xcodeproj/project.pbxproj \
            | head -100 || true

          echo
          echo "=== generated Package.resolved ==="
          find src-tauri/gen/apple \
            -name 'Package.resolved' \
            -print

      - name: Check Tauri CLI and plugin versions
        run: |
          echo "=== Tauri CLI ==="
          pnpm tauri --version

          echo
          echo "=== Cargo.lock Tauri versions ==="
          grep -A2 -B2 'name = "tauri"' src-tauri/Cargo.lock | head -20
          grep -A2 -B2 'name = "tauri-build"' src-tauri/Cargo.lock | head -20
          grep -A2 -B2 'name = "tauri-plugin"' src-tauri/Cargo.lock | head -20

          echo
          echo "=== Plugin build dependency ==="
          grep -n -A5 -B5 'tauri-plugin.*build' src-tauri/plugins/tauri-plugin-native-utils/Cargo.toml



      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------

      - name: Build iOS without signing
        run: pnpm tauri ios build --no-sign

      # ------------------------------------------------------------
      # Inspect ORIGINAL IPA
      # ------------------------------------------------------------

      - name: Inspect original IPA
        run: |
          set -e

          IPA="src-tauri/gen/apple/build/arm64/DashBeam.ipa"
          WORK="/tmp/dashbeam-original"

          rm -rf "$WORK"
          mkdir -p "$WORK"

          unzip -q "$IPA" -d "$WORK"

          APP_PATH=$(find "$WORK/Payload" \
            -maxdepth 1 \
            -type d \
            -name "*.app" \
            | head -1)

          echo "=== IPA ==="
          ls -lh "$IPA"

          echo
          echo "=== APP ==="
          echo "$APP_PATH"

          echo
          echo "=== Frameworks ==="
          find "$APP_PATH/Frameworks" \
            -maxdepth 1 \
            -type f \
            -print \
            || true

          echo
          echo "=== All Swift libraries ==="
          find "$APP_PATH" \
            -name "libswift*.dylib" \
            -print \
            || true

          echo
          echo "=== DashBeam Swift dependencies ==="

          xcrun otool -L "$APP_PATH/DashBeam" \
            | grep -E 'swift|Swift' \
            || true

          echo
          echo "=== DashBeam load commands ==="

          xcrun otool -l "$APP_PATH/DashBeam" \
            | grep -A3 -B2 \
              -E 'LC_LOAD_DYLIB|LC_LOAD_WEAK_DYLIB' \
            | grep -E \
              'swift|LC_LOAD' \
            || true

          echo
          echo "=== Code signature ==="

          codesign -dvv "$APP_PATH" 2>&1 || true

      # ------------------------------------------------------------
      # CRITICAL EXPERIMENT:
      #
      # Remove the old Swift concurrency runtime that Tauri/Xcode
      # placed into the bundle.
      #
      # The main executable references it weakly.
      # On modern iOS the Swift runtime is provided by the OS.
      # ------------------------------------------------------------

      - name: Remove bundled Swift runtime
        run: |
          set -e

          IPA="src-tauri/gen/apple/build/arm64/DashBeam.ipa"
          WORK="/tmp/dashbeam-clean"

          rm -rf "$WORK"
          mkdir -p "$WORK"

          unzip -q "$IPA" -d "$WORK"

          APP_PATH=$(find "$WORK/Payload" \
            -maxdepth 1 \
            -type d \
            -name "*.app" \
            | head -1)

          FRAMEWORKS="$APP_PATH/Frameworks"

          echo "APP_PATH=$APP_PATH"
          echo "FRAMEWORKS=$FRAMEWORKS"

          echo
          echo "=== Swift libraries BEFORE cleanup ==="

          find "$APP_PATH" \
            -name "libswift*.dylib" \
            -print \
            || true

          echo
          echo "=== Removing bundled Swift libraries ==="

          find "$APP_PATH/Frameworks" \
            -maxdepth 1 \
            -type f \
            -name "libswift*.dylib" \
            -print \
            -delete \
            || true

          echo
          echo "=== Swift libraries AFTER cleanup ==="

          find "$APP_PATH" \
            -name "libswift*.dylib" \
            -print \
            || true

          echo
          echo "=== DashBeam dependencies AFTER cleanup ==="

          xcrun otool -L "$APP_PATH/DashBeam" \
            | grep -E 'swift|Swift' \
            || true

          echo
          echo "=== Repacking IPA ==="

          rm -f "$IPA"

          cd "$WORK"

          zip -qry \
            "$GITHUB_WORKSPACE/$IPA" \
            Payload

          echo
          echo "=== Final IPA ==="

          ls -lh "$GITHUB_WORKSPACE/$IPA"

      # ------------------------------------------------------------
      # Final verification
      # ------------------------------------------------------------

      - name: Verify final IPA
        run: |
          set -e

          IPA="src-tauri/gen/apple/build/arm64/DashBeam.ipa"
          TMP="/tmp/dashbeam-final"

          rm -rf "$TMP"
          mkdir -p "$TMP"

          unzip -q "$IPA" -d "$TMP"

          APP_PATH=$(find "$TMP/Payload" \
            -maxdepth 1 \
            -type d \
            -name "*.app" \
            | head -1)

          echo "=== FINAL IPA ==="
          ls -lh "$IPA"

          echo
          echo "=== Frameworks ==="

          find "$APP_PATH/Frameworks" \
            -maxdepth 1 \
            -type f \
            -print \
            || true

          echo
          echo "=== Swift libraries ==="

          find "$APP_PATH" \
            -name "libswift*.dylib" \
            -print \
            || true

          echo
          echo "=== DashBeam dependencies ==="

          xcrun otool -L "$APP_PATH/DashBeam" \
            | grep -E 'swift|Swift' \
            || true

          echo
          echo "=== Architecture ==="

          file "$APP_PATH/DashBeam"

          echo
          echo "=== Code signature ==="

          codesign -dvv "$APP_PATH" 2>&1 || true

      - name: Find IPA
        run: find src-tauri/gen/apple -name "*.ipa" -print

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DashBeam-iOS
          path: src-tauri/gen/apple/**/*.ipa
