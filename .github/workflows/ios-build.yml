name: iOS Build

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Inspect native-utils build metadata
        run: |
          set -e

          echo "=== Cargo build script output ==="

          cargo clean -p tauri-plugin-native-utils

          cargo build \
            --manifest-path src-tauri/plugins/tauri-plugin-native-utils/Cargo.toml \
            -vv \
            2>&1 | tee /tmp/native-utils-build.log

          echo
          echo "=== iOS path references ==="

          grep -niE \
            'ios|Package.swift|native-utils|tauri-plugin' \
            /tmp/native-utils-build.log \
            | head -200 \
            || true
            
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update Tauri CLI
        run: pnpm add -D @tauri-apps/cli@latest

      - name: Install WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked

      - name: Inspect native-utils plugin metadata
        run: |
          set -e

          echo "=== native-utils Cargo.toml ==="
          cat src-tauri/plugins/tauri-plugin-native-utils/Cargo.toml

          echo
          echo "=== native-utils build.rs ==="
          cat src-tauri/plugins/tauri-plugin-native-utils/build.rs

          echo
          echo "=== plugin path ==="
          realpath src-tauri/plugins/tauri-plugin-native-utils/ios

          echo
          echo "=== iOS Package.swift ==="
          cat src-tauri/plugins/tauri-plugin-native-utils/ios/Package.swift
          
      - name: Initialize iOS
        run: |
          rm -rf src-tauri/gen/apple
          pnpm tauri ios init --verbose

      - name: Inspect Tauri plugin build dependency
        run: |
          set -e

          echo "=== tauri-plugin packages in Cargo.lock ==="
          grep -n -A8 -B2 'name = "tauri-plugin"' \
            src-tauri/Cargo.lock

          echo
          echo "=== tauri-utils packages in Cargo.lock ==="
          grep -n -A8 -B2 'name = "tauri-utils"' \
            src-tauri/Cargo.lock

          echo
          echo "=== native-utils dependency tree ==="
          cargo tree \
            --manifest-path src-tauri/Cargo.toml \
            -p tauri-plugin-native-utils \
            -e normal,build \
            | grep -E \
              'tauri-plugin|tauri-utils|tauri v|tauri-build' \
            || true
            
      - name: Inspect native-utils build output
        run: |
          set -e

          echo "=== Native-utils target directories ==="
          find src-tauri/target \
            -type d \
            -path '*tauri-plugin-native-utils*' \
            -print \
            2>/dev/null \
            | head -100 || true

          echo
          echo "=== Native-utils generated files ==="
          find src-tauri/target \
            -type f \
            -path '*tauri-plugin-native-utils*' \
            -print \
            2>/dev/null \
            | head -200 || true

          echo
          echo "=== Plugin metadata candidates ==="
          find src-tauri/target \
            -type f \
            \( \
              -name '*.json' -o \
              -name '*.toml' -o \
              -name '*.plist' \
            \) \
            -print \
            2>/dev/null \
            | grep -i 'native-utils\|plugin' \
            | head -200 || true

      - name: Inspect Tauri iOS configuration
        run: |
          set -e

          echo "=== Tauri config ==="
          cat src-tauri/tauri.conf.json

          echo
          echo "=== Cargo metadata for native-utils ==="
          cargo metadata \
            --manifest-path src-tauri/Cargo.toml \
            --format-version 1 \
            | grep -o \
              '"name":"tauri-plugin-native-utils"' \
            | head -1 \
            || true

          echo
          echo "=== Generated project package references ==="
          grep -nE \
            'XCRemoteSwiftPackageReference|XCLocalSwiftPackageReference|packageReferences|packageProductDependencies' \
            src-tauri/gen/apple/alt-sendme.xcodeproj/project.pbxproj \
            || true

      - name: Check generated iOS project structure
        run: |
          set -e

          echo "=== Generated apple directory ==="
          find src-tauri/gen/apple \
            -maxdepth 3 \
            -type f \
            \( \
              -name "project.pbxproj" \
              -o -name "Package.resolved" \
              -o -name "Package.swift" \
            \) \
            -print

          echo
          echo "=== Xcode package references ==="

          grep -nE \
            'XCRemoteSwiftPackageReference|XCLocalSwiftPackageReference|packageProductDependencies|packageReferences' \
            src-tauri/gen/apple/alt-sendme.xcodeproj/project.pbxproj \
            || true
            
      - name: Verify native-utils package before build
        run: |
          set -e

          echo "=== Plugin iOS package ==="

          find src-tauri/plugins/tauri-plugin-native-utils/ios \
            -maxdepth 3 \
            -type f \
            -print

          echo
          echo "=== Package.swift ==="

          cat src-tauri/plugins/tauri-plugin-native-utils/ios/Package.swift

          echo
          echo "=== Source plugin entry point ==="

          grep -nE \
            'class NativeUtilsPlugin|selectDownloadFolder|init_plugin_native_utils|initPlugin' \
            src-tauri/plugins/tauri-plugin-native-utils/ios/Sources/NativeUtilsPlugin.swift \
            || true

          echo
          echo "=== Generated Xcode project ==="

          grep -niE \
            'native-utils|native_utils|NativeUtils|XCRemoteSwiftPackageReference|XCLocalSwiftPackageReference' \
            src-tauri/gen/apple/alt-sendme.xcodeproj/project.pbxproj \
            || true

          echo
          echo "=== Package.resolved ==="

          find src-tauri/gen/apple \
            -name 'Package.resolved' \
            -print \
            -exec grep -niE \
              'native-utils|native_utils|NativeUtils' {} \; \
            || true
            
      - name: Install LLVM
        run: brew install llvm

      - name: Add LLVM to PATH
        run: echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      # ------------------------------------------------------------
      # Inspect generated Xcode project
      # ------------------------------------------------------------

      - name: Inspect Xcode project
        run: |
          cd src-tauri/gen/apple

          echo "=== Build settings ==="

          xcodebuild \
            -project alt-sendme.xcodeproj \
            -target alt-sendme_iOS \
            -showBuildSettings \
            | grep -E \
              'TARGET_NAME|SWIFT_VERSION|ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES|EMBEDDED_CONTENT_CONTAINS_SWIFT|LD_RUNPATH_SEARCH_PATHS|IPHONEOS_DEPLOYMENT_TARGET|SDKROOT' \
            || true

          echo
          echo "=== Project Swift settings ==="

          grep -nE \
            'SWIFT_VERSION|ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES|EMBEDDED_CONTENT_CONTAINS_SWIFT' \
            alt-sendme.xcodeproj/project.pbxproj \
            || true

      # ------------------------------------------------------------
      # There are no Swift sources in this project.
      # Explicitly prevent Xcode from embedding Swift runtime.
      # ------------------------------------------------------------

      - name: Disable Swift runtime embedding
        run: |
          python3 <<'PY'
          from pathlib import Path

          project = Path(
              "src-tauri/gen/apple/alt-sendme.xcodeproj/project.pbxproj"
          )

          text = project.read_text()

          # Remove settings we previously injected.
          text = text.replace(
              "ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES = YES;",
              "ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES = NO;"
          )

          text = text.replace(
              "EMBEDDED_CONTENT_CONTAINS_SWIFT = YES;",
              "EMBEDDED_CONTENT_CONTAINS_SWIFT = NO;"
          )

          project.write_text(text)

          print("Swift runtime embedding disabled.")
          PY

      - name: Verify Swift embedding settings
        run: |
          cd src-tauri/gen/apple

          echo "=== Final Xcode settings ==="

          xcodebuild \
            -project alt-sendme.xcodeproj \
            -target alt-sendme_iOS \
            -showBuildSettings \
            | grep -E \
              'ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES|EMBEDDED_CONTENT_CONTAINS_SWIFT|SWIFT_VERSION|LD_RUNPATH_SEARCH_PATHS' \
            || true

      # ------------------------------------------------------------
      # Inspect generated native sources
      # ------------------------------------------------------------

      - name: Verify native-utils iOS plugin
        run: |
          echo "=== Source iOS plugin ==="
          find src-tauri/plugins/tauri-plugin-native-utils/ios -type f -maxdepth 5 -print

          echo
          echo "=== selectDownloadFolder in source ==="
          grep -Rni "selectDownloadFolder" \
            src-tauri/plugins/tauri-plugin-native-utils/ios || true

          echo
          echo "=== Generated iOS plugin ==="
          find src-tauri/gen/apple \
            -type f \
            \( -name "*.swift" -o -name "Package.swift" \) \
            -print | grep -i native || true

          echo
          echo "=== selectDownloadFolder in generated project ==="
          grep -Rni "selectDownloadFolder" \
            src-tauri/gen/apple 2>/dev/null || true
            
      - name: Inspect Xcode native-utils integration
        run: |
          echo "=== native-utils in pbxproj ==="
          grep -niE \
            'native-utils|native_utils|NativeUtils' \
            src-tauri/gen/apple/alt-sendme.xcodeproj/project.pbxproj \
            || true

          echo
          echo "=== package references ==="
          grep -niE \
            'package|XCRemoteSwiftPackageReference|XCLocalSwiftPackageReference' \
            src-tauri/gen/apple/alt-sendme.xcodeproj/project.pbxproj \
            | head -100 || true

          echo
          echo "=== generated Package.resolved ==="
          find src-tauri/gen/apple \
            -name 'Package.resolved' \
            -print

      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------

      - name: Build iOS without signing
        run: pnpm tauri ios build --no-sign

      # ------------------------------------------------------------
      # Inspect ORIGINAL IPA
      # ------------------------------------------------------------

      - name: Inspect original IPA
        run: |
          set -e

          IPA="src-tauri/gen/apple/build/arm64/DashBeam.ipa"
          WORK="/tmp/dashbeam-original"

          rm -rf "$WORK"
          mkdir -p "$WORK"

          unzip -q "$IPA" -d "$WORK"

          APP_PATH=$(find "$WORK/Payload" \
            -maxdepth 1 \
            -type d \
            -name "*.app" \
            | head -1)

          echo "=== IPA ==="
          ls -lh "$IPA"

          echo
          echo "=== APP ==="
          echo "$APP_PATH"

          echo
          echo "=== Frameworks ==="
          find "$APP_PATH/Frameworks" \
            -maxdepth 1 \
            -type f \
            -print \
            || true

          echo
          echo "=== All Swift libraries ==="
          find "$APP_PATH" \
            -name "libswift*.dylib" \
            -print \
            || true

          echo
          echo "=== DashBeam Swift dependencies ==="

          xcrun otool -L "$APP_PATH/DashBeam" \
            | grep -E 'swift|Swift' \
            || true

          echo
          echo "=== DashBeam load commands ==="

          xcrun otool -l "$APP_PATH/DashBeam" \
            | grep -A3 -B2 \
              -E 'LC_LOAD_DYLIB|LC_LOAD_WEAK_DYLIB' \
            | grep -E \
              'swift|LC_LOAD' \
            || true

          echo
          echo "=== Code signature ==="

          codesign -dvv "$APP_PATH" 2>&1 || true

      # ------------------------------------------------------------
      # CRITICAL EXPERIMENT:
      #
      # Remove the old Swift concurrency runtime that Tauri/Xcode
      # placed into the bundle.
      #
      # The main executable references it weakly.
      # On modern iOS the Swift runtime is provided by the OS.
      # ------------------------------------------------------------

      - name: Remove bundled Swift runtime
        run: |
          set -e

          IPA="src-tauri/gen/apple/build/arm64/DashBeam.ipa"
          WORK="/tmp/dashbeam-clean"

          rm -rf "$WORK"
          mkdir -p "$WORK"

          unzip -q "$IPA" -d "$WORK"

          APP_PATH=$(find "$WORK/Payload" \
            -maxdepth 1 \
            -type d \
            -name "*.app" \
            | head -1)

          FRAMEWORKS="$APP_PATH/Frameworks"

          echo "APP_PATH=$APP_PATH"
          echo "FRAMEWORKS=$FRAMEWORKS"

          echo
          echo "=== Swift libraries BEFORE cleanup ==="

          find "$APP_PATH" \
            -name "libswift*.dylib" \
            -print \
            || true

          echo
          echo "=== Removing bundled Swift libraries ==="

          find "$APP_PATH/Frameworks" \
            -maxdepth 1 \
            -type f \
            -name "libswift*.dylib" \
            -print \
            -delete \
            || true

          echo
          echo "=== Swift libraries AFTER cleanup ==="

          find "$APP_PATH" \
            -name "libswift*.dylib" \
            -print \
            || true

          echo
          echo "=== DashBeam dependencies AFTER cleanup ==="

          xcrun otool -L "$APP_PATH/DashBeam" \
            | grep -E 'swift|Swift' \
            || true

          echo
          echo "=== Repacking IPA ==="

          rm -f "$IPA"

          cd "$WORK"

          zip -qry \
            "$GITHUB_WORKSPACE/$IPA" \
            Payload

          echo
          echo "=== Final IPA ==="

          ls -lh "$GITHUB_WORKSPACE/$IPA"

      # ------------------------------------------------------------
      # Final verification
      # ------------------------------------------------------------

      - name: Verify final IPA
        run: |
          set -e

          IPA="src-tauri/gen/apple/build/arm64/DashBeam.ipa"
          TMP="/tmp/dashbeam-final"

          rm -rf "$TMP"
          mkdir -p "$TMP"

          unzip -q "$IPA" -d "$TMP"

          APP_PATH=$(find "$TMP/Payload" \
            -maxdepth 1 \
            -type d \
            -name "*.app" \
            | head -1)

          echo "=== FINAL IPA ==="
          ls -lh "$IPA"

          echo
          echo "=== Frameworks ==="

          find "$APP_PATH/Frameworks" \
            -maxdepth 1 \
            -type f \
            -print \
            || true

          echo
          echo "=== Swift libraries ==="

          find "$APP_PATH" \
            -name "libswift*.dylib" \
            -print \
            || true

          echo
          echo "=== DashBeam dependencies ==="

          xcrun otool -L "$APP_PATH/DashBeam" \
            | grep -E 'swift|Swift' \
            || true

          echo
          echo "=== Architecture ==="

          file "$APP_PATH/DashBeam"

          echo
          echo "=== Code signature ==="

          codesign -dvv "$APP_PATH" 2>&1 || true

      - name: Find IPA
        run: find src-tauri/gen/apple -name "*.ipa" -print

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DashBeam-iOS
          path: src-tauri/gen/apple/**/*.ipa
