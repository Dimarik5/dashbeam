name: iOS Build

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked

      - name: Initialize iOS
        run: pnpm tauri ios init

      - name: Install LLVM
        run: brew install llvm

      - name: Add LLVM to PATH
        run: echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Build WASM
        run: pnpm run build:wasm

      - name: Build frontend
        run: pnpm run build

      - name: Build iOS without signing
        run: |
          xcodebuild \
            -project src-tauri/gen/apple/alt-sendme.xcodeproj \
            -scheme alt-sendme_iOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Find app
        run: |
          find ~/Library/Developer/Xcode/DerivedData -name "alt-sendme_iOS.app" -type d -print

      - name: Create IPA
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "alt-sendme_iOS.app" -type d -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: alt-sendme_iOS.app not found"
            exit 1
          fi

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/alt-sendme_iOS.app

          zip -r DashBeam.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DashBeam-iOS
          path: DashBeam.ipa
