name: iOS Build

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update Tauri CLI
        run: pnpm add -D @tauri-apps/cli@latest

      - name: Install WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked

      - name: Initialize iOS
        run: |
          rm -rf src-tauri/gen/apple
          pnpm tauri ios init

      - name: Install LLVM
        run: brew install llvm

      - name: Add LLVM to PATH
        run: echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Inspect Xcode Swift settings
        run: |
          cd src-tauri/gen/apple

          xcodebuild \
            -project alt-sendme.xcodeproj \
            -target alt-sendme_iOS \
            -showBuildSettings \
            | grep -E \
              'TARGET_NAME|SWIFT_VERSION|SWIFT_OBJC_INTERFACE_HEADER_NAME|ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES|EMBEDDED_CONTENT_CONTAINS_SWIFT|LD_RUNPATH_SEARCH_PATHS|SDKROOT'

      - name: Inspect Swift toolchain
        run: |
          echo "=== xcrun swift ==="
          xcrun --find swift

          echo ""
          echo "=== xcrun swiftc ==="
          xcrun --find swiftc

          echo ""
          echo "=== Swift runtime locations ==="
          find /Applications/Xcode_26.6.app/Contents/Developer/Toolchains \
            -name "libswiftCore.dylib" \
            -o -name "libswift_Concurrency.dylib" \
            2>/dev/null

      - name: Configure Swift runtime embedding
        run: |
          python3 <<'PY'
          from pathlib import Path

          project = Path(
              "src-tauri/gen/apple/alt-sendme.xcodeproj/project.pbxproj"
          )

          text = project.read_text()

          # Remove the value we injected previously.
          text = text.replace(
              "\n\t\t\t\tEMBEDDED_CONTENT_CONTAINS_SWIFT = YES;",
              ""
          )

          # Make Xcode embed the Swift runtime.
          if "ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES = YES;" not in text:
              text = text.replace(
                  "SWIFT_VERSION = 5.0;",
                  "SWIFT_VERSION = 5.0;\n"
                  "\t\t\t\tALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES = YES;"
              )

          project.write_text(text)

          print("Configured Swift runtime embedding.")
          PY
    
      - name: Verify Swift settings
        run: |
          cd src-tauri/gen/apple

          xcodebuild \
            -project alt-sendme.xcodeproj \
            -target alt-sendme_iOS \
            -showBuildSettings \
            | grep -E \
              'ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES|EMBEDDED_CONTENT_CONTAINS_SWIFT|SWIFT_VERSION|LD_RUNPATH_SEARCH_PATHS'
              
      - name: Check Xcode project Swift settings
        run: |
          grep -n "ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES" \
          src-tauri/gen/apple/alt-sendme.xcodeproj/project.pbxproj || true

      - name: Check Swift runtime
        run: |
          SWIFT_LIB_DIR="$(xcrun --sdk iphoneos --show-sdk-path)/usr/lib/swift"

          echo "Swift runtime directory:"
          echo "$SWIFT_LIB_DIR"

          echo ""
          echo "Available Swift libraries:"
          find "$SWIFT_LIB_DIR" -maxdepth 1 -name "libswift*.dylib" -print

      - name: Inspect generated iOS Swift sources
        run: |
          echo "=== Swift files ==="
          find src-tauri/gen/apple \
            -type f \
            \( -name "*.swift" -o -name "*.m" -o -name "*.mm" \) \
            -print

          echo
          echo "=== Swift references ==="
          grep -RniE \
            'import Swift|import Foundation|async |await |Task|@MainActor' \
            src-tauri/gen/apple \
            --include="*.swift" \
            --include="*.m" \
            --include="*.mm" \
            2>/dev/null || true
            
      - name: Build iOS without signing
        run: pnpm tauri ios build --no-sign

      - name: Diagnose Swift runtime before IPA fix
        run: |
          set -e

          IPA="src-tauri/gen/apple/build/arm64/DashBeam.ipa"
          WORK="/tmp/dashbeam-preflight"

          rm -rf "$WORK"
          mkdir -p "$WORK"

          unzip -q "$IPA" -d "$WORK"

          APP_PATH=$(find "$WORK/Payload" -maxdepth 1 -type d -name "*.app" | head -1)

          echo "=== APP ==="
          echo "$APP_PATH"

          echo
          echo "=== Frameworks ==="
          find "$APP_PATH/Frameworks" -maxdepth 1 -type f -print || true

          echo
          echo "=== Main executable Swift dependencies ==="
          xcrun otool -L "$APP_PATH/DashBeam" | grep -E 'swift|Swift' || true

          echo
          echo "=== Existing Swift libraries ==="
          find "$APP_PATH" -name 'libswift*.dylib' -print

          echo
          echo "=== Existing Swift library versions ==="

          while IFS= read -r LIB; do
            echo
            echo "--- $LIB ---"
            xcrun otool -L "$LIB" | grep -E 'libswiftCore|libswift_Concurrency' || true
          done < <(find "$APP_PATH" -name 'libswift*.dylib')
          
      - name: Inspect swift-stdlib-tool
        run: |
          set -e

          TOOL="$(xcrun --find swift-stdlib-tool)"

          echo "Tool: $TOOL"
          echo
          echo "=== Help ==="
          "$TOOL" --help || true

          echo
          echo "=== Version ==="
          "$TOOL" --version || true

      - name: Fix Swift runtime libraries
        run: |
          set -e

          IPA="src-tauri/gen/apple/build/arm64/DashBeam.ipa"
          WORK="/tmp/dashbeam-ipa"

          rm -rf "$WORK"
          mkdir -p "$WORK"

          unzip -q "$IPA" -d "$WORK"

          APP_PATH=$(find "$WORK/Payload" -maxdepth 1 -type d -name "*.app" | head -1)
          FRAMEWORKS="$APP_PATH/Frameworks"

          mkdir -p "$FRAMEWORKS"

          TOOL="$(xcrun --find swift-stdlib-tool)"

          echo "APP_PATH=$APP_PATH"
          echo "FRAMEWORKS=$FRAMEWORKS"
          echo "TOOL=$TOOL"

          echo
          echo "=== Swift libraries BEFORE cleanup ==="
          find "$FRAMEWORKS" \
            -maxdepth 1 \
            -name "libswift*.dylib" \
            -print || true

          echo
          echo "=== Removing existing Swift runtime ==="

          find "$FRAMEWORKS" \
            -maxdepth 1 \
            -name "libswift*.dylib" \
            -delete

          echo
          echo "=== Swift libraries AFTER cleanup ==="
          find "$FRAMEWORKS" \
            -maxdepth 1 \
            -name "libswift*.dylib" \
            -print || true

          echo
          echo "=== Swift stdlib tool ==="
          "$TOOL" --help | head -100

          echo
          echo "=== Copying required Swift runtime ==="

          "$TOOL" \
            --copy \
            --verbose \
            --scan-executable "$APP_PATH/DashBeam" \
            --scan-folder "$FRAMEWORKS" \
            --platform iphoneos \
            --destination "$FRAMEWORKS"

          echo
          echo "=== Swift libraries AFTER tool ==="

          find "$FRAMEWORKS" \
            -maxdepth 1 \
            -name "libswift*.dylib" \
            -print

          echo
          echo "=== Swift Core ==="
          test -f "$FRAMEWORKS/libswiftCore.dylib"
          echo "OK: libswiftCore.dylib"

          echo
          echo "=== Swift Concurrency ==="
          test -f "$FRAMEWORKS/libswift_Concurrency.dylib"
          echo "OK: libswift_Concurrency.dylib"

          echo
          echo "=== DashBeam Swift dependencies ==="
          xcrun otool -L "$APP_PATH/DashBeam" | grep swift || true

          echo
          echo "=== Concurrency dependencies ==="
          xcrun otool -L "$FRAMEWORKS/libswift_Concurrency.dylib" | grep swift || true

          echo
          echo "=== Repacking IPA ==="

          rm -f "$IPA"

          cd "$WORK"
          zip -qry "$GITHUB_WORKSPACE/$IPA" Payload

          echo
          echo "=== Final IPA ==="
          ls -lh "$GITHUB_WORKSPACE/$IPA"

      - name: Inspect Swift runtime versions
        run: |
          set -e

          IPA="src-tauri/gen/apple/build/arm64/DashBeam.ipa"
          TMP="/tmp/dashbeam-runtime-inspect"

          rm -rf "$TMP"
          mkdir -p "$TMP"

          unzip -q "$IPA" -d "$TMP"

          APP_PATH=$(find "$TMP/Payload" -maxdepth 1 -type d -name "*.app" | head -1)
          FRAMEWORKS="$APP_PATH/Frameworks"

          echo "=== Swift libraries ==="
          ls -lh "$FRAMEWORKS"/libswift*.dylib

          echo
          echo "=== libswiftCore ==="
          xcrun otool -L \
            "$FRAMEWORKS/libswiftCore.dylib"

          echo
          echo "=== libswift_Concurrency ==="
          xcrun otool -L \
            "$FRAMEWORKS/libswift_Concurrency.dylib"

          echo
          echo "=== UUID: libswiftCore ==="
          xcrun dwarfdump --uuid \
            "$FRAMEWORKS/libswiftCore.dylib"

          echo
          echo "=== UUID: libswift_Concurrency ==="
          xcrun dwarfdump --uuid \
            "$FRAMEWORKS/libswift_Concurrency.dylib"

          echo
          echo "=== Xcode Swift runtimes ==="

          find /Applications/Xcode_26.6.app/Contents/Developer/Toolchains \
            \( -path "*/iphoneos/libswiftCore.dylib" \
            -o -path "*/iphoneos/libswift_Concurrency.dylib" \) \
            -print

      - name: Compare Swift runtime binaries
        run: |
          set -e

          IPA="src-tauri/gen/apple/build/arm64/DashBeam.ipa"
          TMP="/tmp/dashbeam-runtime-compare"

          rm -rf "$TMP"
          mkdir -p "$TMP"

          unzip -q "$IPA" -d "$TMP"

          APP_PATH=$(find "$TMP/Payload" -maxdepth 1 -type d -name "*.app" | head -1)
          FRAMEWORKS="$APP_PATH/Frameworks"

          echo "=== IPA SHA256 ==="

          shasum -a 256 \
            "$FRAMEWORKS/libswiftCore.dylib"

          shasum -a 256 \
            "$FRAMEWORKS/libswift_Concurrency.dylib"

          echo
          echo "=== Xcode swift-5.0 SHA256 ==="

          shasum -a 256 \
            /Applications/Xcode_26.6.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/iphoneos/libswiftCore.dylib

          echo
          echo "=== Xcode swift-5.5 SHA256 ==="

          shasum -a 256 \
            /Applications/Xcode_26.6.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.5/iphoneos/libswift_Concurrency.dylib

          echo
          echo "=== File information ==="

          file "$FRAMEWORKS/libswiftCore.dylib"
          file "$FRAMEWORKS/libswift_Concurrency.dylib"
          
      - name: Verify Swift runtime in IPA
        run: |
          set -e

          IPA="src-tauri/gen/apple/build/arm64/DashBeam.ipa"
          TMP="/tmp/dashbeam-verify"

          rm -rf "$TMP"
          mkdir -p "$TMP"

          unzip -q "$IPA" -d "$TMP"

          APP_PATH=$(find "$TMP/Payload" -maxdepth 1 -type d -name "*.app" | head -1)

          echo "=== Swift libraries in final IPA ==="
          find "$APP_PATH/Frameworks" \
            -maxdepth 1 \
            -name "libswift*.dylib" \
            -print

          echo
          echo "=== libswiftCore ==="
          test -f "$APP_PATH/Frameworks/libswiftCore.dylib"
          echo "OK: libswiftCore.dylib is present"

          echo
          echo "=== libswift_Concurrency ==="
          test -f "$APP_PATH/Frameworks/libswift_Concurrency.dylib"
          echo "OK: libswift_Concurrency.dylib is present"
          
      - name: Find IPA
        run: find src-tauri/gen/apple -name "*.ipa" -print

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DashBeam-iOS
          path: src-tauri/gen/apple/**/*.ipa
