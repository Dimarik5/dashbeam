name: iOS Build (test version)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios wasm32-unknown-unknown

      # Обязательно для build-wasm-bridge.js
      - name: Install LLVM
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      # Обязательно для WASM моста
      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update Tauri CLI
        run: pnpm add -D @tauri-apps/cli@latest

      - name: Initialize iOS
        run: |
          rm -rf src-tauri/gen/apple
          pnpm tauri ios init

      - name: Build iOS without signing
        run: pnpm tauri ios build --no-sign

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DashBeam-iOS
          path: src-tauri/gen/apple/build/arm64/*.ipa
